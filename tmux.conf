# Default terminal inside tmux
set -g default-terminal "tmux-256color"

# Enable true color (RGB) and OSC 52 clipboard for Alacritty
set -as terminal-features ",alacritty:RGB:clipboard,xterm-256color:RGB:clipboard"

# Enable OSC 52 clipboard integration
set -s set-clipboard on
set -s get-clipboard request

# Allow escape sequence passthrough (for Neovim/OSC 52)
set -g allow-passthrough on

# Launch Neovim by default
set -g default-command "exec nvim"

# Hide the status bar
set -g status off

# Make ⌘-key available
set -s extended-keys on
set -s extended-keys-format csi-u
